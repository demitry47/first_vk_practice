# Trino из одного узла: координатор сам же выполняет задачи.
# Для Q18 на sf4 нужна группировка lineitem по orderkey (6 млн групп), а fact_orders в Silver
# строится джойном этого агрегата с orders. По умолчанию запросу дается 30 % кучи, этого мало,
# поэтому лимит поднят до 3 ГБ. Docker должен выделять не меньше 7 ГБ памяти.
coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080
query.max-memory=3GB
query.max-memory-per-node=3GB
