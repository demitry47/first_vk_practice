# Каталог "iceberg": таблицы Apache Iceberg.
# Метаданные таблиц хранит Lakekeeper (REST Catalog), файлы данных лежат в MinIO (S3 API).
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://lakekeeper:8181/catalog
iceberg.rest-catalog.warehouse=q18wh
iceberg.file-format=PARQUET
iceberg.compression-codec=ZSTD

fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=minio-lab
s3.aws-secret-key=minio-lab-pass-2026
